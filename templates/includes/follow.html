<a class="ig-link {{ extra|default('') }}" href="{{ instagram_url }}" rel="me noopener noreferrer" target="_blank">
  <span>{{ label }}</span>
  <svg class="ig-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="{{ ig_id }}" cx="28%" cy="115%" r="140%">
        <stop offset="0%" stop-color="#f9ce34"></stop>
        <stop offset="38%" stop-color="#ee2a7b"></stop>
        <stop offset="100%" stop-color="#6228d7"></stop>
      </radialGradient>
    </defs>
    <rect x="1.4" y="1.4" width="21.2" height="21.2" rx="6" fill="url(#{{ ig_id }})"></rect>
    <rect x="5" y="5" width="14" height="14" rx="4" fill="none" stroke="#fff" stroke-width="1.5"></rect>
    <circle cx="12" cy="12" r="3.3" fill="none" stroke="#fff" stroke-width="1.5"></circle>
    <circle cx="16.7" cy="7.3" r="0.95" fill="#fff"></circle>
  </svg>
</a>
